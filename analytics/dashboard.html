<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiAlign · 站长统计（私有）</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --ink:#101828; --muted:#667085; --line:#E4E7EC; --blue:#2456E5; --paper:#F6F7F9; --amber:#FFC845; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--paper); color:var(--ink); font-size:14.5px; line-height:1.6; }
  .wrap { max-width:1080px; margin:0 auto; padding:40px 24px 80px; }
  header { display:flex; align-items:center; gap:16px; margin-bottom:6px; }
  .logo { width:46px; height:46px; border-radius:13px; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:21px; font-weight:900; }
  header h1 { font-size:22px; }
  header .sub { color:var(--muted); font-size:13px; }
  .lock { margin-left:auto; background:#ECFDF3; color:#067647; border:1px solid #ABEFC6;
    border-radius:999px; padding:5px 14px; font-size:12.5px; font-weight:700; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 24px;
    box-shadow:0 1px 3px rgba(16,24,40,.06); margin-top:18px; }
  .card h2 { font-size:15px; margin-bottom:14px; color:#344054; }
  .gate input { border:1px solid var(--line); border-radius:9px; padding:10px 14px; font-size:14px; width:100%; }
  .gate .row { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .gate .row input { flex:1; min-width:220px; }
  .gate button { background:var(--blue); color:#fff; border:none; border-radius:9px;
    padding:10px 22px; font-size:14px; font-weight:700; cursor:pointer; }
  .gate .tip { color:var(--muted); font-size:12.5px; margin-top:10px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; }
  .kpi b { font-size:30px; font-weight:900; display:block; }
  .kpi span { color:var(--muted); font-size:12.5px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12.5px; }
  td.num { font-variant-numeric:tabular-nums; }
  .bars { display:flex; align-items:flex-end; gap:8px; height:180px; }
  .bar { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px; height:100%; }
  .bar .col { width:70%; background:var(--blue); border-radius:4px 4px 0 0; min-height:2px; }
  .bar .col.uv { background:#B2CCFF; position:absolute; }
  .bar .lbl { font-size:10.5px; color:var(--muted); white-space:nowrap; }
  .bar .v { font-size:11px; color:#344054; font-weight:700; }
  .hbar { margin:7px 0; }
  .hbar .t { display:flex; justify-content:space-between; font-size:12.5px; color:#344054; margin-bottom:3px; }
  .hbar .track { height:10px; background:#EEF1F5; border-radius:999px; overflow:hidden; }
  .hbar .fill { height:100%; background:var(--blue); border-radius:999px; }
  .err { color:#B42318; background:#FEF3F2; border:1px solid #FECDCA; border-radius:10px;
    padding:12px 16px; font-size:13.5px; margin-top:14px; display:none; }
  .hidden { display:none; }
  .legend { display:flex; gap:18px; font-size:12.5px; color:var(--muted); margin-bottom:10px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  footer { color:var(--muted); font-size:12.5px; margin-top:26px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">⇄</div>
    <div>
      <h1>MultiAlign 站长统计</h1>
      <div class="sub">私有数据 · 匿名聚合事件计数，不含任何用户文本</div>
    </div>
    <span class="lock">🔒 仅密钥持有者可见</span>
  </header>

  <div class="card gate" id="gate">
    <h2>连接统计端点</h2>
    <div class="row">
      <input id="ep" placeholder="Worker 地址，如 https://multi-align-stats.xxx.workers.dev">
      <input id="key" type="password" placeholder="ADMIN_KEY 管理密钥">
      <button id="go">加载</button>
    </div>
    <div class="tip">部署方法见仓库 <code>analytics/README.md</code>。连接信息只保存在你本机浏览器的 localStorage，不会发给任何第三方。</div>
    <div class="err" id="err"></div>
  </div>

  <div id="data" class="hidden">
    <div class="card"><h2>累计概览</h2><div class="kpis" id="kpis"></div></div>
    <div class="card"><h2>近 14 天浏览（PV / UV）</h2>
      <div class="legend"><span><i style="background:#2456E5"></i>PV 浏览量</span><span><i style="background:#B2CCFF"></i>UV 独立访客</span></div>
      <div class="bars" id="chart"></div></div>
    <div class="card"><h2>事件统计</h2><div id="events"></div></div>
    <div class="card"><h2>浏览器语言分布</h2><div id="langs"></div></div>
    <div class="card"><h2>按日明细</h2>
      <table><thead><tr><th>日期</th><th>PV</th><th>UV</th><th>对齐</th><th>导出</th><th>字幕导入</th><th>平均停留</th></tr></thead>
      <tbody id="days"></tbody></table></div>
    <footer>数据来源：你的 Worker 匿名聚合事件。用户文本内容不在此列——工具从不上传文本。</footer>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var cfg = null;
  try { cfg = JSON.parse(localStorage.getItem('ma_stats_cfg') || 'null'); } catch (e) {}
  if (cfg) { $('ep').value = cfg.ep || ''; $('key').value = cfg.key || ''; }

  function showError(msg) {
    var e = $('err'); e.textContent = msg; e.style.display = 'block';
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function kpi(label, value) {
    return '<div class="kpi"><b>' + esc(value) + '</b><span>' + esc(label) + '</span></div>';
  }
  function hbar(label, value, max) {
    var pct = max ? Math.round(value / max * 100) : 0;
    return '<div class="hbar"><div class="t"><span>' + esc(label) + '</span><span>' + esc(value) + '</span></div>' +
      '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div></div>';
  }
  function fmtDur(s) { return s >= 60 ? Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒' : s + ' 秒'; }

  function render(data) {
    var t = data.totals || {}, ev = t.events || {}, langs = t.langs || {};
    $('kpis').innerHTML =
      kpi('总浏览 PV', t.views || 0) + kpi('独立访客 UV', t.uv || 0) +
      kpi('复访率', (t.repeatRate || 0) + '%') + kpi('平均停留', fmtDur(t.avgDur || 0));
    // 14 天柱状图
    var days = (data.days || []).slice(0, 14).reverse();
    var maxV = Math.max(1, Math.max.apply(null, days.map(function (d) { return d.views || 0; })));
    $('chart').innerHTML = days.map(function (d) {
      var h = Math.round((d.views || 0) / maxV * 130), hu = Math.round((d.uv || 0) / maxV * 130);
      return '<div class="bar" style="position:relative">' +
        '<span class="v">' + (d.views || 0) + '</span>' +
        '<div class="col" style="height:' + h + 'px"></div>' +
        '<div class="col uv" style="height:' + hu + 'px;width:70%;bottom:calc(' + (h ? h : 2) + 'px + 18px)"></div>' +
        '<span class="lbl">' + esc((d.date || '').slice(5)) + '</span></div>';
    }).join('');
    // 事件
    var evNames = { align: '自动对齐', export: '导出语料', srt_import: '字幕导入', leave: '会话结束' };
    var evMax = Math.max(1, Math.max.apply(null, Object.keys(ev).map(function (k) { return ev[k]; })));
    $('events').innerHTML = Object.keys(ev).length
      ? Object.keys(ev).sort(function (a, b) { return ev[b] - ev[a]; })
          .map(function (k) { return hbar(evNames[k] || k, ev[k], evMax); }).join('')
      : '<span style="color:var(--muted)">暂无事件</span>';
    // 语言
    var langKeys = Object.keys(langs);
    var langMax = Math.max(1, Math.max.apply(null, langKeys.map(function (k) { return langs[k]; })));
    $('langs').innerHTML = langKeys.length
      ? langKeys.sort(function (a, b) { return langs[b] - langs[a]; })
          .map(function (k) { return hbar(k, langs[k], langMax); }).join('')
      : '<span style="color:var(--muted)">暂无数据</span>';
    // 明细
    $('days').innerHTML = (data.days || []).map(function (d) {
      return '<tr><td>' + esc(d.date) + '</td><td class="num">' + (d.views || 0) + '</td><td class="num">' +
        (d.uv || 0) + '</td><td class="num">' + ((d.ev || {}).align || 0) + '</td><td class="num">' +
        ((d.ev || {}).export || 0) + '</td><td class="num">' + ((d.ev || {}).srt_import || 0) +
        '</td><td class="num">' + fmtDur(d.avgDur || 0) + '</td></tr>';
    }).join('');
    $('gate').classList.add('hidden');
    $('data').classList.remove('hidden');
  }

  function load() {
    var ep = $('ep').value.trim().replace(/\/+$/, '');
    var key = $('key').value.trim();
    if (!ep || !key) { showError('请填写 Worker 地址与管理密钥'); return; }
    $('err').style.display = 'none';
    fetch(ep + '/stats?key=' + encodeURIComponent(key))
      .then(function (r) { if (r.status === 403) throw new Error('密钥不正确'); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        try { localStorage.setItem('ma_stats_cfg', JSON.stringify({ ep: ep, key: key })); } catch (e) {}
        render(data);
      })
      .catch(function (e) { showError('加载失败：' + e.message + '（请检查地址与密钥；注意 https 混合内容限制）'); });
  }

  $('go').addEventListener('click', load);
  $('key').addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });
  if (cfg && cfg.ep && cfg.key) load();
})();
</script>
</body>
</html>
