name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Gitleaks（防密扫描）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Python 校验依赖（XLSX/DOCX 断言用）
        run: python3 -m pip install --quiet openpyxl python-docx

      - name: 回归测试（分句/对齐/合并/导出/导入/SRT/统计/编排；数量以脚本输出为准）
        run: node agent-skill/scripts/pipeline_test.js

      - name: 金标准对齐基准（宏平均 F1 ≥ 97%）
        run: node benchmark/run_benchmark.js --min-f1 0.97

      - name: 覆盖率门槛（核心模块行覆盖）
        run: |
          npx --yes c8 --reporter=json-summary \
            --include "js/aligner.js" --include "js/segmenter.js" --include "js/exporters.js" \
            --include "js/srt.js" --include "js/merge.js" \
            bash -c "node agent-skill/scripts/pipeline_test.js > /dev/null && node benchmark/run_benchmark.js --min-f1 0 > /dev/null"
          node test/check_coverage.js

      - name: 导出编排 E2E（真实点击 TMX / SRT / SRT ZIP）
        run: bash test/run_e2e.sh

  lint:
    name: Lint（eslint）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（仅 devDependencies，不引入运行时依赖）
        run: npm ci

      - name: ESLint
        run: npm run lint

  commitlint:
    name: Commitlint（提交规范校验）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验 PR 中的提交信息
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
